[project]
name = "catface"
version = "0.1.0"
description = "Cat facial landmarks, expression class, and an expression warper"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "numpy",
    "opencv-python-headless",
    "openvino",
    "pillow",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "httpx"]
train = ["torch", "scikit-learn", "pandas", "matplotlib"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
